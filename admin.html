<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin — Ramu</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #ece5d8; color: #2a241e; font: 15px/1.45 system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px;
      background: #1f1a16; color: #f3eee6; }
    header h1 { margin: 0; font-size: 17px; font-weight: 650; }
    header span { color: #f2992a; }
    header a { color: #f3eee6; font-size: 14px; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
    .card { background: #f7f3ec; border: 1px solid #e0d7c8; border-radius: 14px; padding: 20px; }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card p { margin: 0 0 16px; color: #6f6357; font-size: 14px; }
    .value { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .value output { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .value .level { padding: 2px 10px; border-radius: 999px; background: #f2992a; color: #2a1a08; font-size: 13px; font-weight: 600; }
    input[type=range] { width: 100%; height: 28px; accent-color: #d9621a; }
    .scale { display: flex; justify-content: space-between; font-size: 12px; color: #7a6e62; margin-bottom: 16px; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; cursor: pointer; }
    .presets button { padding: 8px 14px; border-radius: 8px; border: 1px solid #d8cfc1; background: #fff; color: #2a241e; }
    .presets button:hover { background: #f0e9dd; }
    .presets button[aria-pressed="true"] { background: #2a241e; border-color: #2a241e; color: #fff; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #d9621a; outline-offset: 2px; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px;
      padding-top: 14px; border-top: 1px solid #e4dccf; font-size: 13px; }
    #status { color: #2e7d32; min-height: 1.4em; }
    #status.err { color: #b3261e; }
    #reset { border: 0; background: none; padding: 0; color: #b5480a; text-decoration: underline; }
    .note { margin-top: 16px; font-size: 13px; color: #6f6357; }
  </style>
</head>
<body>
  <header>
    <h1>Ramu <span>Admin</span></h1>
    <a href="./" target="_blank" rel="noopener">Open game ↗</a>
  </header>
  <main>
    <section class="card">
      <h2><label for="crowd">Crowd density</label></h2>
      <p>How many pedestrians are kept on the streets around the player.</p>
      <div class="value"><output id="crowd-out" for="crowd">90</output><span>people</span><span class="level" id="level">Normal</span></div>
      <input type="range" id="crowd" min="0" max="300" step="5" value="90" />
      <div class="scale"><span>0</span><span>150</span><span>300</span></div>
      <div class="presets" id="presets" role="group" aria-label="Presets"></div>
      <div class="foot">
        <span id="status" role="status"></span>
        <button id="reset" type="button">Reset to default</button>
      </div>
    </section>
    <p class="note">Changes save automatically and apply straight away to a game open in this browser.
      Phones and tablets show half this number. Settings are stored in this browser only.</p>
  </main>
  <script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
