<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ramu" />
  <meta name="theme-color" content="#1d140f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>Ramu — Moti Jheel</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d6d3c4; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; color: #333; }
    #minimap { position: fixed; right: 16px; top: 16px; width: 180px; height: 180px; border-radius: 50%;
      box-shadow: 0 2px 10px rgba(0,0,0,.35); border: 3px solid rgba(255,255,255,.85); }
    #credits { position: fixed; left: 0; right: 0; bottom: 0; padding: 3px 8px; font-size: 11px; color: #fff;
      background: rgba(0,0,0,.35); text-align: right; pointer-events: none; }
    #life { position: fixed; left: 68px; top: 70px; display: flex; align-items: center; gap: 8px; padding: 5px 10px;
      border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; font: 700 12px system-ui, sans-serif; pointer-events: none; }
    .life-track { width: 150px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.22); overflow: hidden; }
    .life-fill { height: 100%; width: 100%; border-radius: 6px; transition: width .25s, background .25s; }
    .life-num { min-width: 24px; text-align: right; }
    #hurt-flash { position: fixed; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(180,0,0,0) 45%, rgba(180,0,0,.8) 100%); }
    #ko-banner { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #fff; font: 700 28px system-ui, sans-serif;
      text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #hint { position: fixed; left: 68px; top: 104px; padding: 6px 10px; border-radius: 6px; font-size: 13px;
      color: #fff; background: rgba(0,0,0,.4); pointer-events: none; }
    #debug { position: fixed; left: 16px; bottom: 26px; padding: 4px 8px; font: 12px ui-monospace, monospace;
      color: #0f0; background: rgba(0,0,0,.6); }
    /* ---- touch controls (body.touch): a mobile shooter's layout ---- */
    :root { --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px);
      --sb: env(safe-area-inset-bottom, 0px); --u: 1px; }
    /* the stick: resting low on the left, it comes to the thumb wherever the left part of the screen is touched */
    #stick { position: fixed; display: none; width: calc(130 * var(--u)); height: calc(130 * var(--u)); border-radius: 50%;
      left: calc(60px + var(--sl)); bottom: calc(40px + var(--sb)); background: rgba(0,0,0,.14); border: 2px solid rgba(255,255,255,.35);
      pointer-events: none; transition: opacity .2s; opacity: .7; }
    #stick.on { opacity: 1; transition: none; }
    #knob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%; border-radius: 50%;
      background: rgba(255,255,255,.55); box-shadow: 0 1px 6px rgba(0,0,0,.35); }
    /* pushed up past the ring onto this: the sprint locks on (he runs on by himself until the stick is touched again) */
    #sprint { position: absolute; left: 50%; bottom: calc(100% + 18 * var(--u)); width: calc(40 * var(--u)); height: calc(40 * var(--u));
      margin-left: calc(-20 * var(--u)); border-radius: 50%; display: none; place-items: center; color: #fff;
      background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.5); }
    #stick.on #sprint, #stick.lock #sprint { display: grid; }
    #sprint.hot, #stick.lock #sprint { background: rgba(242,153,42,.85); border-color: #ffd9a0; }
    #sprint svg { width: 60%; height: 60%; }
    .tbtn { position: fixed; display: none; width: calc(var(--s, 58) * var(--u)); height: calc(var(--s, 58) * var(--u)); border-radius: 50%;
      border: 2px solid rgba(255,255,255,.55); background: rgba(0,0,0,.28); color: #fff; padding: 0; place-items: center;
      font: 700 12px system-ui, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: none; -webkit-user-select: none; user-select: none; }
    .tbtn svg { width: 52%; height: 52%; pointer-events: none; }
    .tbtn.on { background: rgba(232,89,12,.7); border-color: #ffd9a0; }
    .tbtn:active, .tbtn.held { background: rgba(255,255,255,.3); }
    /* the right thumb's corner: FIRE big, SCOPE above it, JUMP and CROUCH at the edge */
    .tbtn.big { --s: 84; right: calc((26 + 58 + 18) * var(--u) + var(--sr)); bottom: calc((40 + 30) * var(--u) + var(--sb)); }
    #btn-punch .shoot, body.gun-out #btn-punch .fist { display: none; }
    body.gun-out #btn-punch .shoot { display: contents; }
    body.gun-out #btn-punch { background: rgba(170,30,20,.5); border-color: rgba(255,200,190,.7); }
    #btn-aim { right: calc((26 + 58 + 18 + 13) * var(--u) + var(--sr)); bottom: calc((40 + 30 + 84 + 16) * var(--u) + var(--sb)); }
    #btn-jump { right: calc(22 * var(--u) + var(--sr)); bottom: calc((40 + 58 + 22) * var(--u) + var(--sb)); }
    #btn-crouch { --s: 52; right: calc(26 * var(--u) + var(--sr)); bottom: calc(30 * var(--u) + var(--sb)); }
    /* a second FIRE above the stick (the left thumb shoots while the right one aims) */
    #btn-fire-l { --s: 56; left: calc(66 * var(--u) + var(--sl)); bottom: calc((40 + 130 + 70) * var(--u) + var(--sb)); background: rgba(170,30,20,.45); }
    /* use / get in: only when there is something to use, by the right thumb */
    .tbtn.use { --s: 0; width: auto; height: calc(44 * var(--u)); padding: 0 16px; border-radius: 22px; right: calc((26 + 58 + 18 + 100) * var(--u) + var(--sr));
      bottom: calc((40 + 30 + 84 + 40) * var(--u) + var(--sb)); background: rgba(242,153,42,.85); border-color: #ffd9a0; font-size: 14px; letter-spacing: .2px; }
    /* driving: held arrows, the gas over the brake by the left edge, steering left and right along the bottom right; the
       way out above them on the right, the horn and the lights beside it */
    .tbtn.pedal { --s: 74; background: rgba(0,0,0,.38); border-color: rgba(255,255,255,.6); }
    .tbtn.pedal svg { width: 46%; height: 46%; }
    .tbtn.pedal.held { background: rgba(255,255,255,.38); }
    #btn-gas { left: calc(70 * var(--u) + var(--sl)); bottom: calc((36 + 74 + 34) * var(--u) + var(--sb)); }
    #btn-brake { left: calc(70 * var(--u) + var(--sl)); bottom: calc(36 * var(--u) + var(--sb)); }
    #btn-right { right: calc(34 * var(--u) + var(--sr)); bottom: calc(40 * var(--u) + var(--sb)); }
    #btn-left { right: calc((34 + 74 + 44) * var(--u) + var(--sr)); bottom: calc(40 * var(--u) + var(--sb)); }
    #btn-horn { --s: 50; right: calc((34 + 74 + 44 + 12) * var(--u) + var(--sr)); bottom: calc((40 + 74 + 26) * var(--u) + var(--sb)); }
    #btn-lights { --s: 50; right: calc((34 + 12) * var(--u) + var(--sr)); bottom: calc((40 + 74 + 26) * var(--u) + var(--sb)); }
    body.driving .tbtn.use { right: calc(22 * var(--u) + var(--sr)); bottom: calc((40 + 74 + 26 + 50 + 30) * var(--u) + var(--sb));
      background: rgba(0,0,0,.45); border-color: rgba(255,255,255,.6); }
    body.driving #stick { display: none !important; }
    body.touch.driving #use-tip { display: none !important; }   /* (its key means nothing here: EXIT is the way out) */
    body:not(.driving) .tbtn.car { display: none !important; }
    body.driving .tbtn.foot, body.driving #btn-jump, body.driving .tbtn.big, body.driving #btn-fire-l,
    body:not(.gun-out) .tbtn.gun, body:not(.gun-out) #btn-fire-l, body:not(.can-use):not(.driving) .tbtn.use { display: none !important; }
    #use-tip { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); z-index: 6; display: none;
      padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font: 600 14px system-ui, sans-serif; white-space: pre-line; text-align: center;
      pointer-events: none; }
    /* ---- Explore world: the weapon, the crosshair (src/player/gun.ts) ---- */
    #weapon { position: fixed; right: 16px; bottom: 30px; z-index: 5; display: none; align-items: center; gap: 8px;
      padding: 7px 12px; border-radius: 8px; background: rgba(0,0,0,.5); color: #fff; font: 600 14px system-ui, sans-serif;
      cursor: pointer; user-select: none; }
    #weapon em { font-style: normal; font-size: 18px; color: #ffd27a; margin-left: 4px; }
    body.explore #weapon { display: flex; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 0; height: 0; z-index: 4; display: none; pointer-events: none; }
    body.gun-out #crosshair { display: block; }
    #crosshair i { position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px rgba(0,0,0,.9); transition: transform .12s; }
    #crosshair i:nth-child(1), #crosshair i:nth-child(2) { width: 2px; height: 8px; left: -1px; }
    #crosshair i:nth-child(1) { top: -15px; } #crosshair i:nth-child(2) { top: 7px; }
    #crosshair i:nth-child(3), #crosshair i:nth-child(4) { width: 8px; height: 2px; top: -1px; }
    #crosshair i:nth-child(3) { left: -15px; } #crosshair i:nth-child(4) { left: 7px; }
    #crosshair b { position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 2px #000; }
    #crosshair.aim i:nth-child(1) { transform: translateY(5px); } #crosshair.aim i:nth-child(2) { transform: translateY(-5px); }
    #crosshair.aim i:nth-child(3) { transform: translateX(5px); } #crosshair.aim i:nth-child(4) { transform: translateX(-5px); }
    #crosshair.hit i, #crosshair.hit b { background: #ff3b2f; }
    /* ---- menu ---- */
    .menu-btn { position: fixed; left: 16px; top: 16px; z-index: 20; width: 44px; height: 44px; border-radius: 10px;
      border: 0; background: rgba(0,0,0,.45); display: grid; place-content: center; gap: 4px; cursor: pointer;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .menu-btn span { display: block; width: 20px; height: 2px; border-radius: 2px; background: #fff; }
    .menu-btn:hover, .menu-btn[aria-expanded="true"] { background: rgba(0,0,0,.65); }
    .menu-btn:focus-visible, .menu-item:focus-visible, .menu-close:focus-visible, .map-btn:focus-visible
      { outline: 2px solid #f2992a; outline-offset: 2px; }
    .menu-drop { position: fixed; left: 16px; top: 66px; z-index: 20; min-width: 200px; padding: 6px;
      border-radius: 12px; background: rgba(28,24,20,.88); box-shadow: 0 8px 28px rgba(0,0,0,.35);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .15s, transform .15s; }
    .menu-drop.on { opacity: 1; transform: none; pointer-events: auto; }
    .menu-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0;
      border-radius: 8px; background: none; color: #f3eee6; font: 500 15px system-ui, sans-serif; cursor: pointer; text-align: left; }
    .menu-item:hover { background: rgba(255,255,255,.1); }
    .menu-item svg { color: #f2992a; flex: none; }
    .menu-overlay { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; padding: 16px;
      background: rgba(20,16,12,.45); }
    .menu-overlay.on { display: grid; }
    .menu-panel { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 14px;
      background: #f7f3ec; color: #2a241e; box-shadow: 0 16px 48px rgba(0,0,0,.4); box-sizing: border-box; }
    .menu-panel[data-item="map"] { width: min(900px, 100%); }
    .menu-panel[data-item="controls"] { width: min(640px, 100%); }
    .place-search { width: 100%; padding: 10px 12px; border: 1px solid #cfc5b4; border-radius: 8px; font: inherit; background: #fff; margin-bottom: 10px; }
    .test-head { margin: 14px 0 8px; font-size: 15px; font-weight: 700; }
    .place-list { display: grid; gap: 6px; max-height: min(52vh, 420px); overflow: auto; }
    .place-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 11px 14px;
      border: 1px solid #e0d7c8; border-radius: 10px; background: #fff; color: #2b2520; font: 600 14px system-ui, sans-serif; cursor: pointer; text-align: left; }
    .place-row:hover:not(:disabled) { border-color: #f2992a; background: #fff6e8; }
    .place-row:disabled { background: #f0e9dd; color: #7a6e62; cursor: default; }
    .place-meta { font-weight: 400; font-size: 12px; color: #7a6e62; }
    .start-at { margin-bottom: 18px; }
    .start-at h3 { margin: 0 0 8px; font-size: 15px; }
    .start-at .place-row[aria-pressed="true"] { border-color: #f2992a; background: #fff6e8; }
    .ctl-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 16px; }
    .ctl-table th { text-align: left; font-weight: 600; font-size: 12px; color: #7a6e62; padding: 0 6px 8px 0; }
    .ctl-table td { padding: 4px 6px 4px 0; border-top: 1px solid #ebe4d8; }
    .ctl-default { color: #9a8e80; font-size: 12px; }
    .key-btn { min-width: 84px; padding: 6px 10px; border: 1px solid #cfc5b4; border-radius: 8px; background: #fff; color: #2b2520;
      font: 600 13px system-ui, sans-serif; cursor: pointer; }
    .key-btn:hover { border-color: #f2992a; }
    .key-btn.changed { border-color: #f2992a; background: #fff6e8; }
    .key-btn.listening { border-color: #e8590c; background: #ffe9d6; color: #b33f00; }
    .key-btn:focus-visible { outline: 2px solid #f2992a; outline-offset: 2px; }
    .menu-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 20px;
      border-bottom: 1px solid #e4dccf; }
    .menu-head h2 { margin: 0; font: 650 18px system-ui, sans-serif; }
    .menu-close { width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; font-size: 26px;
      line-height: 1; color: #5a5046; cursor: pointer; }
    .menu-close:hover { background: #ebe4d8; }
    .menu-body { padding: 18px 20px 20px; }
    .profile-top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .profile-name { font-weight: 700; font-size: 18px; }
    .avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
      background: #d02027; color: #fff; font: 700 28px system-ui, sans-serif; }
    .field { flex: 1; display: grid; gap: 4px; font-size: 12px; color: #7a6e62; }
    .name-input { font: 500 17px system-ui, sans-serif; padding: 9px 11px; border: 1px solid #d8cfc1; border-radius: 8px;
      background: #fff; color: #2a241e; min-width: 0; }
    .name-input:focus { outline: 2px solid #f2992a; border-color: transparent; }
    .rows { display: grid; grid-template-columns: auto 1fr; gap: 10px 20px; margin: 0; font-size: 14px; }
    .rows dt { color: #7a6e62; }
    .rows dd { margin: 0; font-weight: 500; text-align: right; }
    .map-canvas { display: block; width: 100%; height: min(62vh, 560px); border-radius: 10px; touch-action: none;
      cursor: grab; background: #d9cfb8; }
    .map-canvas:active { cursor: grabbing; }
    .map-bar { display: flex; gap: 8px; margin-top: 10px; }
    .map-btn { width: 40px; height: 36px; border: 1px solid #d8cfc1; border-radius: 8px; background: #fff;
      font-size: 17px; color: #2a241e; cursor: pointer; }
    .map-btn:hover { background: #f0e9dd; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .stat { padding: 14px; border-radius: 10px; background: #fff; border: 1px solid #ebe3d6; }
    .stat-v { font: 650 22px system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #2a241e; }
    .stat-l { margin-top: 2px; font-size: 12px; color: #7a6e62; }
    .muted { margin: 14px 0 0; font-size: 12px; color: #7a6e62; }
    .score-h { margin: 22px 0 10px; font: 650 15px system-ui, sans-serif; }
    .menu-body > .score-h:first-child { margin-top: 0; }
    .score-rows { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: #fff; border: 1px solid #ebe3d6; font-size: 13px; }
    .score-best { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    .runs-table td { font-variant-numeric: tabular-nums; }
    .runs-table tbody tr:not(.run-more) { cursor: pointer; }
    .runs-table tbody tr:not(.run-more):hover td { background: #fff6e8; }
    .runs-table tbody tr:focus-visible { outline: 2px solid #f2992a; outline-offset: -2px; }
    .run-more > td { padding: 8px 0 14px; border-top: 0; }
    .link-btn { border: 0; background: none; padding: 0; color: #b5480a; font: inherit; text-decoration: underline; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .menu-drop { transition: none; } }
    @media (pointer: coarse) {
      .tbtn { display: grid; }
      #stick { display: block; }
      #minimap { width: 120px; height: 120px; }
      #hint { display: none; }
    }
    body.cinema #weapon { visibility: hidden; }

    /* ---- touch screens (body.touch, src/ui/mobile.ts): laid out for the phone held sideways ---- */
    body.touch { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; }
    /* the weapon (tap to change), beside AIM */
    body.touch #weapon { right: auto; left: 50%; transform: translateX(-50%); bottom: calc(12px + var(--sb)); padding: 6px 12px; }
    body.touch .sh-toast { font-size: 15px; }
    body.touch #life { left: calc(16px + var(--sl)); }
    /* held upright anyway: the mission box under the map, off Ramu and the buttons */
    @media (orientation: portrait) {
      body.touch .obj { top: calc(150px + var(--st)); bottom: auto; }
      body.touch #credits { font-size: 9px; padding: 1px 6px calc(1px + var(--sb)); }
    }
    /* a phone held sideways: the screen is short, so everything smaller and pushed into the corners, the middle left
       for the street */
    @media (orientation: landscape) and (max-height: 540px) {
      body.touch { --u: min(1px, calc(100vh / 400)); }
      body.touch .menu-btn { left: calc(10px + var(--sl)); top: calc(10px + var(--st)); width: 40px; height: 40px; }
      body.touch .menu-drop { left: calc(10px + var(--sl)); top: calc(56px + var(--st)); max-height: calc(100vh - 66px); overflow: auto; }
      body.touch .sh-chip { left: calc(58px + var(--sl)); top: calc(10px + var(--st)); height: 40px; }
      body.touch .sh-chip-name { display: none; }
      body.touch #life { left: calc(10px + var(--sl)); top: calc(58px + var(--st)); padding: 4px 8px; font-size: 11px; }
      body.touch .life-track { width: 76px; height: 10px; }
      body.touch #minimap { right: calc(10px + var(--sr)); top: calc(10px + var(--st)); width: 92px; height: 92px; border-width: 2px; }
      body.touch .obj { top: calc(10px + var(--st)); bottom: auto; padding: 6px 10px 7px; min-width: 0;
        width: min(420px, calc(100vw - 2 * (max(var(--sl), var(--sr)) + 192px))); }
      body.touch .obj-line { font-size: 14px; margin-top: 1px; }
      body.touch .obj-hint { font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      body.touch .sh-toast { top: 32%; font-size: 14px; padding: 9px 14px; max-width: calc(100vw - 2 * (max(var(--sl), var(--sr)) + 150px)); }
      body.touch #credits { left: calc(8px + var(--sl)); right: auto; bottom: var(--sb); padding: 1px 6px; font-size: 9px; text-align: left;
        border-radius: 4px 4px 0 0; background: rgba(0,0,0,.25); }
      body.touch #debug { left: calc(10px + var(--sl)); bottom: calc(16px + var(--sb)); font-size: 10px; }
      body.touch:not(.cinema) .subs { bottom: calc(10px + var(--sb)); max-width: calc(100vw - 2 * (var(--sr) + 220px)); padding: 6px 12px 7px; }
      body.touch .subs-line { font-size: 15px; }
      body.touch .cine-skip { right: calc(14px + var(--sr)); top: calc(10px + var(--st)); bottom: auto; }
      body.touch .rq { bottom: calc(8px + var(--sb)); max-height: calc(100vh - 70px); overflow: auto; padding: 10px 12px;
        width: min(640px, calc(100vw - 2 * max(var(--sl), var(--sr)) - 24px)); }
      body.touch .rq-line { font-size: 16px; margin: 4px 0 6px; }
      body.touch .rq-list { gap: 6px; }
      body.touch .rq-choice { font-size: 13px; padding: 7px 9px; }
      body.touch .grip { bottom: calc(60px + var(--sb)); }
      body.touch .grip-wrap { width: 84px; height: 84px; }
      body.touch .grip-key { display: none; }
      body.touch #use-tip { bottom: 26%; font-size: 13px; }
      body.touch #ko-banner { font-size: 22px; }
      body.touch .menu-overlay { padding: 8px calc(8px + var(--sr)) 8px calc(8px + var(--sl)); }
      body.touch .menu-panel { max-height: calc(100vh - 16px); }
      body.touch .menu-body { padding: 12px 16px 14px; }
      body.touch .map-canvas { height: calc(100vh - 140px); }
    }
    /* full screen: a button by the map until it is (src/ui/mobile.ts); an iPhone's card about the Home Screen */
    .fs-btn { position: fixed; z-index: 7; right: calc(146px + var(--sr)); top: calc(16px + var(--st)); width: 38px; height: 38px;
      display: grid; place-items: center; border-radius: 10px; border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.4);
      color: #fff; padding: 0; -webkit-tap-highlight-color: transparent; }
    body.full .fs-btn { display: none; }
    .home-tip { position: fixed; z-index: 60; left: 50%; top: calc(10px + var(--st)); transform: translateX(-50%); display: flex;
      align-items: center; gap: 10px; max-width: calc(100vw - 24px); padding: 8px 8px 8px 14px; border-radius: 12px;
      background: rgba(29,20,15,.92); color: #f3eee6; font: 13px/1.35 system-ui, sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .home-tip b { color: #f2a54a; white-space: nowrap; }
    .home-tip button { flex: none; padding: 7px 12px; border-radius: 8px; border: 0; background: #f2992a; color: #1d140f; font: 700 13px system-ui, sans-serif; }
    @media (orientation: landscape) and (max-height: 540px) {
      .fs-btn { right: calc(110px + var(--sr)); top: calc(10px + var(--st)); width: 34px; height: 34px; }
    }
    /* held upright: a card asks for the phone to be turned */
    .rotate { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 120%, #5a2c12, #1d140f 70%); color: #f3eee6; font-family: system-ui, sans-serif; }
    .rotate.on { display: grid; }
    .rotate-card { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 320px; text-align: center; }
    .rotate-icon { color: #f3eee6; animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    .rotate-title { margin: 4px 0 0; font-size: 22px; color: #f2a54a; text-wrap: balance; }
    .rotate-sub { margin: 0; font-size: 15px; line-height: 1.45; color: #d8c9b4; }
    .rotate-anyway { margin-top: 10px; padding: 10px 16px; border: 1px solid rgba(243,238,230,.4); border-radius: 10px; background: none;
      color: #f3eee6; font: 600 14px system-ui, sans-serif; cursor: pointer; }
    .rotate-anyway:focus-visible { outline: 2px solid #f2992a; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .rotate-icon { animation: none; transform: rotate(-90deg); } }
  </style>
</head>

  <button class="tbtn gun" id="btn-aim" aria-label="Scope"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button class="tbtn" id="btn-jump" aria-label="Jump"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>

  <button class="tbtn use" id="btn-use">GET IN</button>
  <!-- driving: gas and brake under the left thumb, steering under the right -->
  <button class="tbtn car pedal" id="btn-gas" aria-label="Accelerate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 8h-4.2v9H9.2v-9H5z" fill="currentColor"/></svg></button>
  <button class="tbtn car pedal" id="btn-brake" aria-label="Brake / reverse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21l-7-8h4.2V4h5.6v9H19z" fill="currentColor"/></svg></button>
  <button class="tbtn car pedal" id="btn-left" aria-label="Steer left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l8-7v4.2h9v5.6h-9V19z" fill="currentColor"/></svg></button>
  <button class="tbtn car pedal" id="btn-right" aria-label="Steer right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12l-8 7v-4.2H4V9.2h9V5z" fill="currentColor"/></svg></button>
  <button class="tbtn car" id="btn-horn" aria-label="Horn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="tbtn car" id="btn-lights" aria-label="Lights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6c-4 0-6 2.7-6 6s2 6 6 6c1.5 0 2-.8 2-6s-.5-6-2-6zM16 8h5M16 12h5M16 16h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="use-tip"></div>
  <div id="credits"></div>
